name: Python Selenium CI/CD

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.7

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome and ChromeDriver
        run: |
          # Install Google Chrome
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # Install the latest ChromeDriver
          wget -q https://chromedriver.storage.googleapis.com/`curl -s https://chromedriver.storage.googleapis.com/LATEST_RELEASE`/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

          # Verify installations
          google-chrome --version
          chromedriver --version

      - name: Set environment variable (Test)
        run: echo "ENV=test" >> $GITHUB_ENV

      - name: Run tests
        run: |
          echo "Running tests in $ENV environment"
          pytest --maxfail=1 --disable-warnings -q --html=report.html

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: pytest-report
          path: report.html
